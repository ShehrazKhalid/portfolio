name: Build and publish portfolio
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      refresh_media:
        description: Refresh bundled galleries from their source listings
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Validate data and code
        run: npm test
      - name: Refresh artwork only when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_media
        run: npm run media -- --refresh
      - name: Build static website
        run: npm run build
      - name: Check all generated local URLs
        run: node tools/verify-site.mjs
      - name: Keep the media report and downloaded assets
        uses: actions/upload-artifact@v4
        with:
          name: project-media-and-report
          path: |
            assets/projects/
            data/portfolio.json
            data/media-report.json
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
